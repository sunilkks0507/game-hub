<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="pebbleGrad" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064E3B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Garden Background Tile -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGrad)" stroke="#A7F3D0" stroke-width="12" filter="url(#softShadow)"/>

  <!-- Garden Grid Accent -->
  <path d="M 24 256 L 488 256 M 256 24 L 256 488" stroke="#10B981" stroke-width="8" stroke-dasharray="16 12" opacity="0.6"/>

  <!-- Master Blue Pebble -->
  <g transform="translate(0, 10)">
    <!-- Pebble Body -->
    <ellipse cx="256" cy="270" rx="160" ry="145" fill="url(#pebbleGrad)" stroke="#BAE6FD" stroke-width="10"/>

    <!-- Shiny Highlight -->
    <ellipse cx="200" cy="180" rx="60" ry="25" fill="#FFFFFF" opacity="0.35" transform="rotate(-15 200 180)"/>

    <!-- Left Eye -->
    <ellipse cx="195" cy="250" rx="22" ry="26" fill="#0F172A"/>
    <circle cx="188" cy="242" r="9" fill="#FFFFFF"/>
    <circle cx="204" cy="258" r="4" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <ellipse cx="317" cy="250" rx="22" ry="26" fill="#0F172A"/>
    <circle cx="310" cy="242" r="9" fill="#FFFFFF"/>
    <circle cx="326" cy="258" r="4" fill="#FFFFFF"/>

    <!-- Cheerful Smile -->
    <path d="M 215 295 Q 256 340 297 295" stroke="#0F172A" stroke-width="9" stroke-linecap="round" fill="#F43F5E"/>

    <!-- Rosy Cheeks -->
    <circle cx="160" cy="285" r="16" fill="#F43F5E" opacity="0.35"/>
    <circle cx="352" cy="285" r="16" fill="#F43F5E" opacity="0.35"/>

    <!-- Sprouting Garden Leaf On Top -->
    <path d="M 256 128 C 220 90 230 40 280 50 C 290 85 270 120 256 128 Z" fill="#4ADE80" stroke="#15803D" stroke-width="5"/>
    <path d="M 256 128 C 290 100 320 110 320 135 C 295 145 270 135 256 128 Z" fill="#22C55E" stroke="#15803D" stroke-width="4"/>
  </g>

  <!-- Golden Crown Star -->
  <polygon points="120,110 132,136 160,138 139,158 145,185 120,171 95,185 101,158 80,138 108,136" fill="url(#starGrad)" stroke="#CA8A04" stroke-width="4"/>
</svg>
